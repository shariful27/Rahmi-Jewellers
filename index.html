<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahmi Jewellers - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            padding: 40px 20px;
            border: 2px solid #d4af37;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        h1 {
            color: #d4af37;
            font-size: 2.5rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            color: #dddddd;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* নতুন নোটিশ বক্সের স্টাইল */
        .notice-box {
            background-color: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            color: #ffca28;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin: 25px 0 15px 0;
            line-height: 1.5;
        }

        .footer-text {
            font-size: 0.9rem;
            color: #888888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rahmi Jewellers</h1>
        <p>আপনার ওয়েবসাইটটি খুব দ্রুত রেডি হচ্ছে!</p>
        <p>নতুন এবং আকর্ষণীয় ডিজাইনে খুব শীঘ্রই আসছি।</p>
        
        <!-- নোটিশ সেকশন -->
        <div class="notice-box">
            ⚠️ ফ্রি সার্ভারে সাইট ৭-৮ দিন চলবে, পরে অটো বন্ধ হয়ে যাবে। আপনি দ্রুত আপনার নিজের সার্ভারে সাইট এড করে নিবেন। ধন্যবাদ।
        </div>

        <p class="footer-text">আমাদের সাথে থাকার জন্য ধন্যবাদ।</p>
    </div>

</body>
</html>
