<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Price Poster - Manual Edit</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Poppins:wght@300;400;600&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #08080a; color: #fff; padding: 20px; }
    .main-container { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; max-width: 1000px; margin: auto; }
    .editor-section, .poster-wrapper { width: 100%; max-width: 450px; }
    
    /* Poster Styling */
    .poster { background: #000; padding: 20px; border: 2px solid #c5a059; border-radius: 10px; color: #fff; text-align: center; }
    .brand { font-family: 'Cinzel', serif; font-size: 1.5rem; color: #f7eaad; margin-bottom: 10px; }
    .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
    .card { border: 1px solid #333; padding: 10px; border-radius: 8px; background: #111; }
    .card h3 { font-size: 0.9rem; color: #d4af37; }
    .val { font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
    
    /* Editor Styling */
    .editor { background: #15151a; padding: 20px; border-radius: 12px; border: 1px solid #333; }
    .input-group { margin-bottom: 15px; }
    label { font-size: 0.8rem; display: block; margin-bottom: 5px; color: #aaa; }
    input { width: 100%; padding: 10px; background: #000; border: 1px solid #444; color: #fff; border-radius: 5px; }
    .btn { width: 100%; padding: 12px; background: #d4af37; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="main-container">
  <!-- Poster Preview -->
  <div class="poster-wrapper">
    <div id="poster" class="poster">
      <h2 id="out-shop" class="brand">আপনার দোকানের নাম</h2>
      <p id="out-date">তারিখ: --/--/----</p>
      <div class="price-grid">
        <div class="card"><h3>22K</h3><div id="out-22" class="val">৳ --</div></div>
        <div class="card"><h3>21K</h3><div id="out-21" class="val">৳ --</div></div>
        <div class="card"><h3>18K</h3><div id="out-18" class="val">৳ --</div></div>
        <div class="card"><h3>সনাতন</h3><div id="out-sn" class="val">৳ --</div></div>
      </div>
      <p id="out-address" style="font-size:0.7rem; opacity:0.8;">ঠিকানা এখানে বসবে</p>
    </div>
    <button class="btn" onclick="downloadPoster()">📥 ডাউনলোড করুন</button>
  </div>

  <!-- Manual Editor -->
  <div class="editor-section">
    <div class="editor">
      <h3>⚙️ ম্যানুয়াল রেট আপডেট</h3>
      <br>
      <div class="input-group">
        <label>দোকানের নাম:</label>
        <input type="text" id="in-shop" oninput="updatePoster()">
      </div>
      <div class="input-group">
        <label>আজকের তারিখ:</label>
        <input type="text" id="in-date" oninput="updatePoster()">
      </div>
      
      <div class="price-inputs" style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="input-group"><label>22K ভরি:</label><input type="text" id="in-22" oninput="updatePoster()"></div>
        <div class="input-group"><label>21K ভরি:</label><input type="text" id="in-21" oninput="updatePoster()"></div>
        <div class="input-group"><label>18K ভরি:</label><input type="text" id="in-18" oninput="updatePoster()"></div>
        <div class="input-group"><label>সনাতন ভরি:</label><input type="text" id="in-sn" oninput="updatePoster()"></div>
      </div>

      <div class="input-group">
        <label>ঠিকানা:</label>
        <input type="text" id="in-address" oninput="updatePoster()">
      </div>
    </div>
  </div>
</div>

<script>
  function updatePoster() {
    // UI Update
    document.getElementById('out-shop').innerText = document.getElementById('in-shop').value || "আপনার দোকানের নাম";
    document.getElementById('out-date').innerText = "তারিখ: " + (document.getElementById('in-date').value || "--/--/----");
    document.getElementById('out-22').innerText = "৳ " + (document.getElementById('in-22').value || "--");
    document.getElementById('out-21').innerText = "৳ " + (document.getElementById('in-21').value || "--");
    document.getElementById('out-18').innerText = "৳ " + (document.getElementById('in-18').value || "--");
    document.getElementById('out-sn').innerText = "৳ " + (document.getElementById('in-sn').value || "--");
    document.getElementById('out-address').innerText = document.getElementById('in-address').value || "ঠিকানা এখানে বসবে";

    // Save to LocalStorage
    const data = {
      shop: document.getElementById('in-shop').value,
      date: document.getElementById('in-date').value,
      p22: document.getElementById('in-22').value,
      p21: document.getElementById('in-21').value,
      p18: document.getElementById('in-18').value,
      psn: document.getElementById('in-sn').value,
      addr: document.getElementById('in-address').value
    };
    localStorage.setItem('goldData', JSON.stringify(data));
  }

  function loadData() {
    const saved = localStorage.getItem('goldData');
    if(saved) {
      const d = JSON.parse(saved);
      document.getElementById('in-shop').value = d.shop || "";
      document.getElementById('in-date').value = d.date || "";
      document.getElementById('in-22').value = d.p22 || "";
      document.getElementById('in-21').value = d.p21 || "";
      document.getElementById('in-18').value = d.p18 || "";
      document.getElementById('in-sn').value = d.psn || "";
      document.getElementById('in-address').value = d.addr || "";
      updatePoster();
    }
  }

  function downloadPoster() {
    html2canvas(document.querySelector("#poster")).then(canvas => {
      const a = document.createElement('a');
      a.download = "Gold_Rate.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    });
  }

  window.onload = loadData;
</script>

</body>
</html>
